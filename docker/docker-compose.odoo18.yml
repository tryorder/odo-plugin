# Throwaway Odoo 18 stack to validate the module on the production Odoo version.
#   docker compose -f docker-compose.odoo18.yml -p oc18 up -d
# Odoo: http://localhost:8169
services:
  db18:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - oc18-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo18:
    image: odoo:18
    depends_on:
      db18:
        condition: service_healthy
    ports:
      - "8169:8069"
    environment:
      HOST: db18
      USER: odoo
      PASSWORD: odoo
    volumes:
      - oc18-data:/var/lib/odoo
      - ../:/mnt/extra-addons/order_connector:ro

volumes:
  oc18-db:
  oc18-data:
