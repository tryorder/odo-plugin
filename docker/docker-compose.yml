# Local Odoo 17 stack for developing/testing the Order Connector plugin.
#
#   cd /home/karim-youssef/Sites/odo-plugin/docker
#   docker compose up -d
#
# Odoo:      http://localhost:8069
# Postgres:  localhost:5433 (host) / db:5432 (container)
#
# The plugin repo is mounted read-only as the `order_connector` addon so edits
# on the host are picked up on restart / module upgrade.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"   # longpolling / websocket
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      # Mount the plugin repo root as the addon named "order_connector".
      - ../:/mnt/extra-addons/order_connector:ro

volumes:
  odoo-db:
  odoo-data:
